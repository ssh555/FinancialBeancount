name: Android build

on:
  workflow_call:
    inputs:
      release_build:
        required: true
        type: boolean
      version_name:
        required: true
        type: string
      version_code:
        required: false
        type: number
        default: 0
    secrets:
      FINANCIAL_BEANCOUNT_ANDROID_KEYSTORE:
        required: false
      FINANCIAL_BEANCOUNT_ANDROID_KEYSTORE_PASSWORD:
        required: false
      FINANCIAL_BEANCOUNT_ANDROID_KEY_ALIAS:
        required: false
      FINANCIAL_BEANCOUNT_ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      release_build:
        description: Build a publisher-signed APK suitable for in-place upgrades
        required: true
        type: boolean
        default: false
      version_name:
        description: Android version name (MAJOR.MINOR.PATCH)
        required: true
        type: string
        default: "0.2.0"
      version_code:
        description: Positive Android version code; 0 derives it from the semantic version
        required: true
        type: number
        default: 0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validate requested version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version_name }}
          REQUESTED_CODE: ${{ inputs.version_code }}
        run: |
          version="${REQUESTED_VERSION#v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          code="$REQUESTED_CODE"
          if [[ "$code" == "0" ]]; then
            code=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
          fi
          [[ "$code" =~ ^[1-9][0-9]*$ ]]
          [[ "$code" -le 2100000000 ]]
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Build debug APK
        if: ${{ !inputs.release_build }}
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
        env:
          ORG_GRADLE_PROJECT_appVersionName: ${{ env.APP_VERSION_NAME }}
          ORG_GRADLE_PROJECT_appVersionCode: ${{ env.APP_VERSION_CODE }}
      - name: Prepare protected Android signing identity
        if: ${{ inputs.release_build }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FINANCIAL_BEANCOUNT_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.FINANCIAL_BEANCOUNT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FINANCIAL_BEANCOUNT_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FINANCIAL_BEANCOUNT_ANDROID_KEY_PASSWORD }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "Missing FINANCIAL_BEANCOUNT_ANDROID_KEYSTORE"; exit 1; }
          [[ -n "$KEYSTORE_PASSWORD" ]] || { echo "Missing FINANCIAL_BEANCOUNT_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { echo "Missing FINANCIAL_BEANCOUNT_ANDROID_KEY_ALIAS"; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo "Missing FINANCIAL_BEANCOUNT_ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/financial-beancount.keystore"
      - name: Build and verify signed release APK
        if: ${{ inputs.release_build }}
        working-directory: android
        shell: bash
        env:
          ORG_GRADLE_PROJECT_appVersionName: ${{ env.APP_VERSION_NAME }}
          ORG_GRADLE_PROJECT_appVersionCode: ${{ env.APP_VERSION_CODE }}
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ runner.temp }}/financial-beancount.keystore
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.FINANCIAL_BEANCOUNT_ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.FINANCIAL_BEANCOUNT_ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.FINANCIAL_BEANCOUNT_ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/FinancialBeancount-android-$APP_VERSION_NAME.apk"
          sha256sum "app/build/outputs/apk/release/FinancialBeancount-android-$APP_VERSION_NAME.apk" > "app/build/outputs/apk/release/FinancialBeancount-android-$APP_VERSION_NAME.apk.sha256"
      - name: Remove temporary signing identity
        if: ${{ always() && inputs.release_build }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/financial-beancount.keystore"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release_build }}
        with:
          name: FinancialBeancount-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release_build }}
        with:
          name: FinancialBeancount-android-release-${{ env.APP_VERSION_NAME }}
          path: |
            android/app/build/outputs/apk/release/FinancialBeancount-android-${{ env.APP_VERSION_NAME }}.apk
            android/app/build/outputs/apk/release/FinancialBeancount-android-${{ env.APP_VERSION_NAME }}.apk.sha256
          if-no-files-found: error
