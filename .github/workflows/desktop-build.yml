name: Desktop application build

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Require release signing credentials and emit signed checksum manifests
        required: true
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application build dependencies
        run: python -m pip install ".[xlsx,pdf]" pyinstaller
      - name: Inject trusted release public key
        if: ${{ inputs.signed_release }}
        env:
          FINANCIAL_BEANCOUNT_UPDATE_PUBLIC_KEY: ${{ vars.FINANCIAL_BEANCOUNT_UPDATE_PUBLIC_KEY }}
        run: python scripts/configure_release_identity.py
      - name: Build desktop application
        run: pyinstaller --clean --noconfirm FinancialBeancount.spec
      - name: Verify bundled web application
        shell: python
        run: |
          from pathlib import Path
          output = Path("dist")
          assert output.exists(), output
          matches = list(output.rglob("manifest.webmanifest"))
          assert matches, "bundled PWA manifest is missing"
          print(matches[0])
      - name: Verify packaged update helper
        run: python scripts/smoke_update_helper.py
      - name: Sign Windows application binaries
        if: ${{ matrix.platform == 'windows' && inputs.signed_release }}
        shell: pwsh
        env:
          FINANCIAL_BEANCOUNT_WINDOWS_CERTIFICATE: ${{ secrets.FINANCIAL_BEANCOUNT_WINDOWS_CERTIFICATE }}
          FINANCIAL_BEANCOUNT_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.FINANCIAL_BEANCOUNT_WINDOWS_CERTIFICATE_PASSWORD }}
        run: >-
          ./installer/windows/sign.ps1
          -Path dist/FinancialBeancount/FinancialBeancount.exe,dist/FinancialBeancount/FinancialBeancountUpdater.exe
          -TimestampUrl "${{ vars.FINANCIAL_BEANCOUNT_WINDOWS_TIMESTAMP_URL }}"
      - name: Build Windows MSI
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $version = python -c "import beancount_dedup; print(beancount_dedup.__version__)"
          ./installer/windows/build.ps1 `
            -Source dist/FinancialBeancount `
            -Output artifacts/FinancialBeancount-${{ matrix.platform }}-${{ runner.arch }}.msi `
            -Version $version
      - name: Verify Windows MSI in-place upgrade and data preservation
        if: ${{ matrix.platform == 'windows' && !inputs.signed_release }}
        shell: pwsh
        run: >-
          ./installer/windows/smoke_upgrade.ps1
          -Source dist/FinancialBeancount
          -CurrentMsi artifacts/FinancialBeancount-${{ matrix.platform }}-${{ runner.arch }}.msi
      - name: Build macOS DMG preview
        if: ${{ matrix.platform == 'macos' && !inputs.signed_release }}
        run: >-
          bash installer/macos/build_dmg.sh
          dist/FinancialBeancount.app
          artifacts/FinancialBeancount-${{ matrix.platform }}-${{ runner.arch }}.dmg
      - name: Verify macOS DMG replacement and data preservation
        if: ${{ matrix.platform == 'macos' && !inputs.signed_release }}
        run: >-
          bash installer/macos/smoke_dmg.sh
          artifacts/FinancialBeancount-${{ matrix.platform }}-${{ runner.arch }}.dmg
      - name: Sign and notarize macOS DMG
        if: ${{ matrix.platform == 'macos' && inputs.signed_release }}
        env:
          FINANCIAL_BEANCOUNT_MACOS_CERTIFICATE: ${{ secrets.FINANCIAL_BEANCOUNT_MACOS_CERTIFICATE }}
          FINANCIAL_BEANCOUNT_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.FINANCIAL_BEANCOUNT_MACOS_CERTIFICATE_PASSWORD }}
          FINANCIAL_BEANCOUNT_MACOS_SIGNING_IDENTITY: ${{ vars.FINANCIAL_BEANCOUNT_MACOS_SIGNING_IDENTITY }}
          FINANCIAL_BEANCOUNT_APPLE_ID: ${{ secrets.FINANCIAL_BEANCOUNT_APPLE_ID }}
          FINANCIAL_BEANCOUNT_APPLE_APP_PASSWORD: ${{ secrets.FINANCIAL_BEANCOUNT_APPLE_APP_PASSWORD }}
          FINANCIAL_BEANCOUNT_APPLE_TEAM_ID: ${{ vars.FINANCIAL_BEANCOUNT_APPLE_TEAM_ID }}
        run: >-
          bash installer/macos/sign_and_notarize.sh
          dist/FinancialBeancount.app
          artifacts/FinancialBeancount-${{ matrix.platform }}-${{ runner.arch }}.dmg
      - name: Record macOS native signature evidence
        if: ${{ matrix.platform == 'macos' && inputs.signed_release }}
        run: >-
          python scripts/verify_platform_signature.py
          --platform macos
          --installer artifacts/FinancialBeancount-${{ matrix.platform }}-${{ runner.arch }}.dmg
          --expected-identity "${{ vars.FINANCIAL_BEANCOUNT_MACOS_SIGNING_IDENTITY }}"
      - name: Sign Windows MSI
        if: ${{ matrix.platform == 'windows' && inputs.signed_release }}
        shell: pwsh
        env:
          FINANCIAL_BEANCOUNT_WINDOWS_CERTIFICATE: ${{ secrets.FINANCIAL_BEANCOUNT_WINDOWS_CERTIFICATE }}
          FINANCIAL_BEANCOUNT_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.FINANCIAL_BEANCOUNT_WINDOWS_CERTIFICATE_PASSWORD }}
        run: >-
          ./installer/windows/sign.ps1
          -Path artifacts/FinancialBeancount-${{ matrix.platform }}-${{ runner.arch }}.msi
          -TimestampUrl "${{ vars.FINANCIAL_BEANCOUNT_WINDOWS_TIMESTAMP_URL }}"
      - name: Record Windows native signature evidence
        if: ${{ matrix.platform == 'windows' && inputs.signed_release }}
        run: >-
          python scripts/verify_platform_signature.py
          --platform windows
          --installer artifacts/FinancialBeancount-${{ matrix.platform }}-${{ runner.arch }}.msi
          --expected-identity "${{ vars.FINANCIAL_BEANCOUNT_WINDOWS_PUBLISHER }}"
      - name: Package development asset and checksum
        if: ${{ !inputs.signed_release }}
        run: >-
          python scripts/package_desktop_artifact.py
          --source dist/FinancialBeancount
          --output artifacts/FinancialBeancount-${{ matrix.platform }}-${{ runner.arch }}.zip
      - name: Package signed release asset
        if: ${{ inputs.signed_release }}
        env:
          FINANCIAL_BEANCOUNT_RELEASE_SIGNING_KEY: ${{ secrets.FINANCIAL_BEANCOUNT_RELEASE_SIGNING_KEY }}
          FINANCIAL_BEANCOUNT_UPDATE_PUBLIC_KEY: ${{ vars.FINANCIAL_BEANCOUNT_UPDATE_PUBLIC_KEY }}
        run: >-
          python scripts/package_desktop_artifact.py
          --source dist/FinancialBeancount
          --output artifacts/FinancialBeancount-${{ matrix.platform }}-${{ runner.arch }}.zip
          --require-signature
      - name: Verify preview artifact gate
        if: ${{ !inputs.signed_release }}
        run: >-
          python scripts/release_gate.py
          --repository .
          --artifacts artifacts
          --mode preview
          --platform ${{ matrix.platform }}
          --architecture ${{ runner.arch }}
      - name: Verify signed Windows release gate
        if: ${{ matrix.platform == 'windows' && inputs.signed_release }}
        run: >-
          python scripts/release_gate.py
          --repository .
          --artifacts artifacts
          --mode release
          --platform ${{ matrix.platform }}
          --architecture ${{ runner.arch }}
      - name: Verify signed macOS release gate
        if: ${{ matrix.platform == 'macos' && inputs.signed_release }}
        run: >-
          python scripts/release_gate.py
          --repository .
          --artifacts artifacts
          --mode release
          --platform ${{ matrix.platform }}
          --architecture ${{ runner.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: FinancialBeancount-${{ matrix.platform }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
